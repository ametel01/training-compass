# SwiftPM build products are generated artifacts, not source owned by this repo.
excluded:
  - .build

# These rules conflict with the repository's swift-format output or flag
# intentional domain/API spellings; Swift format remains the formatting gate.
disabled_rules:
  - trailing_comma
  - opening_brace
  - closure_parameter_position
  - optional_data_string_conversion
  - multiple_closures_with_trailing_closure
  - type_name
  - identifier_name

# Training Compass keeps several domain boundaries cohesive across persistence,
# HealthKit, and SwiftUI surfaces. These size metrics remain available to
# developers, but are advisory rather than release-blocking for those seams.
file_length:
  warning: 10000
  error: 12000
type_body_length:
  warning: 10000
  error: 12000
function_body_length:
  warning: 1000
  error: 1200
cyclomatic_complexity:
  warning: 100
  error: 120
function_parameter_count:
  warning: 20
  error: 30
large_tuple:
  warning: 10
  error: 12

line_length:
  warning: 300
  error: 300
